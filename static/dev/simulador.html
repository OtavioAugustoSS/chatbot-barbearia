<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Simulador WhatsApp — Barbearia Bolshoi (dev)</title>
<style>
  :root {
    --bg: #0b141a;
    --panel: #202c33;
    --panel-2: #111b21;
    --accent: #00a884;
    --accent-dark: #008069;
    --bubble-in: #202c33;
    --bubble-out: #005c4b;
    --text: #e9edef;
    --text-dim: #8696a0;
    --warn: #F59E0B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    background: var(--panel); padding: 10px 14px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    border-bottom: 1px solid #2a3942;
  }
  header .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--accent-dark); display: flex; align-items: center; justify-content: center;
    font-size: 19px; flex-shrink: 0;
  }
  header .title { flex: 1; min-width: 140px; }
  header .title h1 { font-size: 15px; font-weight: 600; }
  header .title p { font-size: 12px; color: var(--text-dim); }
  header .ident { display: flex; gap: 6px; flex-wrap: wrap; }
  header input {
    background: var(--panel-2); border: 1px solid #2a3942; color: var(--text);
    border-radius: 8px; padding: 6px 8px; font-size: 12px; width: 138px;
  }
  header input:focus { outline: 1px solid var(--accent); }
  #banner-dev {
    background: #2b2417; color: var(--warn); font-size: 11.5px;
    padding: 6px 14px; line-height: 1.5; border-bottom: 1px solid #3a3120;
  }
  #banner-dev a { color: var(--accent); }
  #chat {
    flex: 1; overflow-y: auto; padding: 16px 10px 8px;
    background: var(--panel-2);
    background-image: radial-gradient(#1a252c 1px, transparent 1px);
    background-size: 22px 22px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .msg { max-width: 86%; padding: 8px 11px; border-radius: 9px; font-size: 14px; line-height: 1.45; word-wrap: break-word; white-space: pre-wrap; position: relative; }
  .msg .hora { display: block; font-size: 10px; color: var(--text-dim); text-align: right; margin-top: 3px; }
  .msg.in  { background: var(--bubble-in); align-self: flex-start; border-top-left-radius: 2px; }
  .msg.out { background: var(--bubble-out); align-self: flex-end; border-top-right-radius: 2px; }
  .msg.sys { background: transparent; color: var(--text-dim); font-size: 11.5px; align-self: center; text-align: center; }
  .msg .header-int { font-weight: 700; margin-bottom: 4px; }
  .msg .footer-int { font-size: 11.5px; color: var(--text-dim); margin-top: 5px; }
  .opcoes { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .opcoes .secao { font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--text-dim); margin-top: 4px; }
  .opcoes button {
    background: rgba(0,168,132,.12); border: 1px solid var(--accent);
    color: var(--accent); border-radius: 8px; padding: 8px 10px;
    font-size: 13.5px; cursor: pointer; text-align: left; width: 100%;
  }
  .opcoes button small { display: block; color: var(--text-dim); font-size: 11.5px; margin-top: 1px; }
  .opcoes button:active { background: rgba(0,168,132,.3); }
  footer {
    background: var(--panel); padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    display: flex; gap: 8px; align-items: center;
  }
  footer input {
    flex: 1; background: var(--panel-2); border: 1px solid #2a3942;
    border-radius: 20px; padding: 11px 15px; color: var(--text); font-size: 15px;
  }
  footer input:focus { outline: 1px solid var(--accent); }
  footer button {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; font-size: 19px; cursor: pointer; flex-shrink: 0;
  }
  footer button:disabled { opacity: .5; }
  .atalhos { display: flex; gap: 6px; overflow-x: auto; padding: 6px 10px; background: var(--panel-2); border-top: 1px solid #2a3942; }
  .atalhos button {
    background: var(--panel); border: 1px solid #2a3942; color: var(--text-dim);
    border-radius: 14px; padding: 5px 11px; font-size: 12px; white-space: nowrap; cursor: pointer;
  }
  b { font-weight: 700; } i { font-style: italic; }
</style>
</head>
<body>
  <header>
    <div class="avatar">💈</div>
    <div class="title">
      <h1>Barbearia Bolshoi <span style="font-size:11px;color:var(--warn)">· SIMULADOR DEV</span></h1>
      <p id="status-linha">conectando…</p>
    </div>
    <div class="ident">
      <input id="telefone" value="5538999990000" title="Telefone simulado" aria-label="Telefone simulado">
      <input id="nome" value="Cliente Demo" title="Nome do cliente" aria-label="Nome do cliente">
    </div>
  </header>
  <div id="banner-dev" hidden></div>
  <div id="chat" aria-live="polite"></div>
  <div class="atalhos" id="atalhos">
    <button data-txt="oi">👋 oi</button>
    <button data-txt="menu">📋 menu</button>
    <button data-txt="quais os preços?">💰 preços</button>
    <button data-txt="que horas abre?">🕘 horário</button>
    <button data-txt="quero agendar um corte">📅 agendar</button>
    <button data-txt="MENU_RECEPCAO">🙋 recepção</button>
  </div>
  <footer>
    <input id="entrada" placeholder="Mensagem" autocomplete="off" aria-label="Mensagem">
    <button id="btn-enviar" aria-label="Enviar">➤</button>
  </footer>

<script>
(() => {
  const chat = document.getElementById('chat');
  const inputMsg = document.getElementById('entrada');
  const btnEnviar = document.getElementById('btn-enviar');
  const inputTel = document.getElementById('telefone');
  const inputNome = document.getElementById('nome');
  let desdeSeq = 0;
  let pollTimer = null;

  const escapeHtml = (s) => String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  // Formatação WhatsApp básica: *negrito*, _itálico_ (aplicada APÓS escape).
  const formatar = (s) => escapeHtml(s)
    .replace(/\*([^*\n]+)\*/g, '<b>$1</b>')
    .replace(/_([^_\n]+)_/g, '<i>$1</i>');

  const hora = () => new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'});

  function bolha(classe, html) {
    const div = document.createElement('div');
    div.className = 'msg ' + classe;
    div.innerHTML = html + `<span class="hora">${hora()}</span>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function sistema(texto) {
    const div = document.createElement('div');
    div.className = 'msg sys';
    div.textContent = texto;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function renderizarEvento(ev) {
    const p = ev.payload || {};
    if (p.type === 'text' && p.text) {
      bolha('in', formatar(p.text.body || ''));
      return;
    }
    if (p.type === 'interactive' && p.interactive) {
      const inter = p.interactive;
      let html = '';
      if (inter.header && inter.header.text) html += `<div class="header-int">${formatar(inter.header.text)}</div>`;
      if (inter.body && inter.body.text) html += formatar(inter.body.text);
      const div = bolha('in', html);
      const opcoes = document.createElement('div');
      opcoes.className = 'opcoes';
      if (inter.type === 'list' && inter.action) {
        (inter.action.sections || []).forEach(sec => {
          if (sec.title) {
            const t = document.createElement('div');
            t.className = 'secao';
            t.textContent = sec.title;
            opcoes.appendChild(t);
          }
          (sec.rows || []).forEach(row => opcoes.appendChild(botaoOpcao(row.id, row.title, row.description)));
        });
      } else if (inter.type === 'button' && inter.action) {
        (inter.action.buttons || []).forEach(b => opcoes.appendChild(botaoOpcao(b.reply.id, b.reply.title)));
      }
      if (opcoes.children.length) div.insertBefore(opcoes, div.querySelector('.hora'));
      if (inter.footer && inter.footer.text) {
        const f = document.createElement('div');
        f.className = 'footer-int';
        f.textContent = inter.footer.text;
        div.insertBefore(f, div.querySelector('.hora'));
      }
      return;
    }
    // Mídia/desconhecido: mostra o tipo cru para depuração.
    bolha('in', `<i>[${escapeHtml(p.type || 'evento')} — ver payload no console]</i>`);
    console.log('Evento dev não renderizado:', ev);
  }

  function botaoOpcao(id, titulo, descricao) {
    const btn = document.createElement('button');
    btn.innerHTML = escapeHtml(titulo || id) + (descricao ? `<small>${escapeHtml(descricao)}</small>` : '');
    btn.addEventListener('click', () => enviar(id, titulo || id));
    return btn;
  }

  async function enviar(texto, rotulo) {
    texto = (texto || '').trim();
    if (!texto) return;
    bolha('out', formatar(rotulo || texto));
    btnEnviar.disabled = true;
    try {
      const resp = await fetch('/dev/api/mensagem', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({telefone: inputTel.value.trim(), nome: inputNome.value.trim(), texto}),
      });
      if (!resp.ok) sistema(`Erro ${resp.status} ao enviar — veja o log do servidor.`);
    } catch (e) {
      sistema('Falha de rede: ' + e.message);
    } finally {
      btnEnviar.disabled = false;
    }
  }

  async function poll() {
    try {
      const tel = encodeURIComponent(inputTel.value.trim());
      const resp = await fetch(`/dev/api/respostas?telefone=${tel}&desde_seq=${desdeSeq}`);
      if (resp.ok) {
        const dados = await resp.json();
        (dados.eventos || []).forEach(renderizarEvento);
        desdeSeq = Math.max(desdeSeq, dados.ultimo_seq || 0);
      }
    } catch (e) { /* servidor reiniciando — tenta de novo no próximo tick */ }
    pollTimer = setTimeout(poll, 1000);
  }

  async function carregarEstado() {
    try {
      const resp = await fetch('/dev/api/estado');
      const s = await resp.json();
      const partes = [];
      if (s.db_sqlite) partes.push('DB: SQLite local');
      if (s.ia_fake) partes.push('IA: demo (sem NVIDIA_API_KEY)');
      if (s.whatsapp_fake) partes.push('WhatsApp: capturado aqui');
      const banner = document.getElementById('banner-dev');
      banner.hidden = false;
      banner.innerHTML = '⚠️ MODO DEV — ' + partes.join(' · ') +
        (s.dashboard_url ? ` · <a href="${s.dashboard_url}" target="_blank">Dashboard do atendente</a> (admin/admin123)` : '');
      document.getElementById('status-linha').textContent =
        'online · modo ' + s.modo_operacao;
    } catch (e) {
      document.getElementById('status-linha').textContent = 'offline';
    }
  }

  // Trocar telefone = nova conversa: limpa o chat e o cursor de polling.
  inputTel.addEventListener('change', () => {
    chat.innerHTML = '';
    desdeSeq = 0;
    sistema('Conversa com novo telefone: ' + inputTel.value);
  });

  btnEnviar.addEventListener('click', () => { enviar(inputMsg.value); inputMsg.value = ''; inputMsg.focus(); });
  inputMsg.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { enviar(inputMsg.value); inputMsg.value = ''; }
  });
  document.getElementById('atalhos').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-txt]');
    if (btn) enviar(btn.dataset.txt);
  });

  sistema('Simulador local — as mensagens passam pelo pipeline real do bot.');
  carregarEstado();
  poll();
})();
</script>
</body>
</html>
