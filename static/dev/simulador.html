<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Simulador WhatsApp — Barbearia Bolshoi (dev)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Design: handoff Claude Design "Painel Bolshoi" (tela Simulador).
     Página autocontida — não depende de /static (que só monta em modo híbrido). */
  :root {
    --app-bg: #12141d;
    --app-panel: #161826;
    --app-card: #232532;
    --app-border: rgba(233,233,237,0.10);
    --app-border-soft: rgba(233,233,237,0.055);
    --txt-1: #e9e9ed;
    --txt-2: #9fa2b1;
    --txt-3: #8a8fa3;
    --accent: #5b93e0;
    --ok: #48c39a;
    --warn: #d9a441;
    --err: #e0655f;
    --bubble-in: #232532;
    --bubble-op: #24406b;
    --tick-read: #8fb8f2;
    --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
    background: radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--accent) 7%, transparent) 0%, transparent 55%), var(--app-bg);
    color: var(--txt-1);
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  ::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--txt-3) 40%, transparent); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* frame do "celular" */
  #frame {
    width: 100%;
    max-width: 430px;
    height: min(720px, 100%);
    display: flex;
    flex-direction: column;
    background: var(--app-panel);
    border: 1px solid var(--app-border);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 16px 40px rgba(0,0,0,0.5);
  }
  @media (max-width: 480px) {
    body { padding: 0; }
    #frame { max-width: none; height: 100%; border-radius: 0; border: none; }
  }

  header {
    background: var(--app-card);
    padding: 10px 14px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    border-bottom: 1px solid var(--app-border-soft);
    flex-shrink: 0;
  }
  header .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: #0c0d13; border: 1px solid var(--app-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; flex-shrink: 0; overflow: hidden;
  }
  header .avatar img { width: 30px; height: 30px; mix-blend-mode: lighten; display: block; }
  header .title { flex: 1; min-width: 140px; }
  header .title h1 { font-size: 13.5px; font-weight: 500; letter-spacing: -0.01em; }
  header .title h1 .dev-badge {
    font-family: var(--mono); font-size: 9px; font-weight: 600;
    letter-spacing: 0.07em; color: var(--warn);
    background: color-mix(in srgb, var(--warn) 12%, transparent);
    padding: 1px 6px; border-radius: 4px; vertical-align: 1px;
  }
  header .title p { font-size: 11px; color: var(--ok); margin-top: 1px; }
  header .ident { display: flex; gap: 6px; flex-wrap: wrap; }
  header input {
    background: var(--app-panel); border: 1px solid var(--app-border-soft); color: var(--txt-1);
    border-radius: 8px; padding: 6px 8px; font-size: 12px; width: 132px;
    font-family: var(--mono); caret-color: var(--accent);
    transition: border-color 0.15s;
  }
  header input:focus { border-color: var(--accent); outline: none; }

  #banner-dev {
    background: color-mix(in srgb, var(--warn) 8%, var(--app-panel));
    color: var(--warn); font-size: 11px;
    padding: 6px 14px; line-height: 1.5;
    border-bottom: 1px solid color-mix(in srgb, var(--warn) 18%, transparent);
    flex-shrink: 0;
  }
  #banner-dev a { color: var(--accent); }

  #chat {
    flex: 1; overflow-y: auto; padding: 16px 12px 8px;
    background-image: radial-gradient(color-mix(in srgb, var(--txt-1) 4.5%, transparent) 1px, transparent 1px);
    background-size: 20px 20px;
    display: flex; flex-direction: column; gap: 7px;
  }
  @keyframes rowInL { from { opacity: 0; transform: translateX(-22px) scale(0.95); } to { opacity: 1; transform: none; } }
  @keyframes rowInR { from { opacity: 0; transform: translateX(22px) scale(0.95); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  .msg {
    max-width: 84%; padding: 9px 12px; font-size: 12.5px; line-height: 1.5;
    word-wrap: break-word; white-space: pre-wrap; position: relative;
    border: 1px solid var(--app-border-soft);
    box-shadow: 0 1px 2px rgba(0,0,0,0.25);
  }
  .msg .hora {
    display: flex; justify-content: flex-end; align-items: center; gap: 4px;
    font-family: var(--mono); font-size: 9px; color: var(--txt-3); margin-top: 3px;
  }
  .msg.in {
    background: var(--bubble-in); align-self: flex-start;
    border-radius: 4px 14px 14px 14px;
    animation: rowInL 0.46s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .msg.out {
    background: var(--bubble-op); align-self: flex-end;
    border-color: color-mix(in srgb, var(--accent) 22%, transparent);
    border-radius: 14px 4px 14px 14px;
    animation: rowInR 0.46s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .msg.sys {
    background: color-mix(in srgb, var(--app-card) 80%, transparent);
    color: var(--txt-2); font-size: 11px;
    align-self: center; text-align: center;
    border: 1px solid var(--app-border-soft);
    border-radius: 99px; padding: 4px 12px;
    box-shadow: none; max-width: 90%;
  }
  .msg .header-int { font-weight: 600; margin-bottom: 4px; }
  .msg .footer-int { font-size: 11px; color: var(--txt-3); margin-top: 5px; }

  .opcoes { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
  .opcoes .secao {
    font-family: var(--mono); font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--txt-3); margin-top: 4px;
  }
  .opcoes button {
    background: transparent; border: 1px solid var(--accent);
    color: var(--accent); border-radius: 8px; padding: 7px 10px;
    font-size: 12px; font-weight: 500; font-family: inherit;
    cursor: pointer; text-align: left; width: 100%;
    transition: background 0.15s, transform 0.15s;
  }
  .opcoes button:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); transform: translateY(-1px); }
  .opcoes button:active { background: color-mix(in srgb, var(--accent) 22%, transparent); transform: scale(0.97); }
  .opcoes button small { display: block; color: var(--txt-3); font-size: 11px; margin-top: 1px; font-weight: 400; }

  .status-controles { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
  .status-controles button {
    background: transparent; border: 1px dashed var(--app-border); color: var(--txt-3);
    border-radius: 10px; padding: 3px 9px; font-size: 10.5px; cursor: pointer;
    font-family: var(--mono); transition: color 0.15s, border-color 0.15s;
  }
  .status-controles button:hover, .status-controles button:active { border-color: var(--accent); color: var(--accent); }
  .status-badge { font-family: var(--mono); font-size: 9.5px; color: var(--txt-3); margin-left: 6px; }
  .status-badge.lida { color: var(--tick-read); }
  .status-badge.falha { color: var(--err); }
  .msg .tick { font-size: 10.5px; margin-left: 5px; color: var(--txt-3); transition: color 0.4s; }
  .msg .tick.azul { color: var(--tick-read); }

  .atalhos {
    display: flex; gap: 6px; overflow-x: auto; padding: 6px 10px;
    background: var(--app-panel); border-top: 1px solid var(--app-border-soft);
    flex-shrink: 0; scrollbar-width: none;
  }
  .atalhos::-webkit-scrollbar { display: none; }
  .atalhos button {
    background: transparent; border: 1px solid var(--app-border); color: var(--txt-2);
    border-radius: 99px; padding: 5px 11px; font-size: 11.5px; white-space: nowrap;
    cursor: pointer; font-family: inherit;
    transition: color 0.15s, border-color 0.15s;
  }
  .atalhos button:hover { color: var(--accent); border-color: var(--accent); }

  footer {
    background: var(--app-card);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    display: flex; gap: 8px; align-items: center;
    border-top: 1px solid var(--app-border-soft);
    flex-shrink: 0;
  }
  footer input {
    flex: 1; min-width: 0; background: var(--app-panel);
    border: 1px solid var(--app-border-soft);
    border-radius: 99px; padding: 9px 14px; color: var(--txt-1); font-size: 12.5px;
    font-family: inherit; caret-color: var(--accent);
    transition: border-color 0.15s;
  }
  footer input:focus { border-color: var(--accent); outline: none; }
  footer button {
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    color: var(--accent); font-size: 15px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1), background 0.15s;
  }
  footer button:hover:not(:disabled) { transform: scale(1.08); background: color-mix(in srgb, var(--accent) 24%, transparent); }
  footer button:active:not(:disabled) { transform: scale(0.88); }
  footer button:disabled { opacity: 0.5; }
  b { font-weight: 700; } i { font-style: italic; }
</style>
</head>
<body>
  <div id="frame">
  <header>
    <div class="avatar"><img src="/static/admin/img/logo-bolshoi.png" alt="" onerror="this.remove();this.parentElement.textContent='💈';"></div>
    <div class="title">
      <h1>Barbearia Bolshoi <span class="dev-badge">SIMULADOR DEV</span></h1>
      <p id="status-linha">conectando…</p>
    </div>
    <div class="ident">
      <input id="telefone" value="5538999990000" title="Telefone simulado" aria-label="Telefone simulado">
      <input id="nome" value="Cliente Demo" title="Nome do cliente" aria-label="Nome do cliente">
    </div>
  </header>
  <div id="banner-dev" hidden></div>
  <div id="chat" aria-live="polite"></div>
  <div class="atalhos" id="atalhos">
    <button data-txt="oi">👋 oi</button>
    <button data-txt="menu">📋 menu</button>
    <button data-txt="quais os preços?">💰 preços</button>
    <button data-txt="que horas abre?">🕘 horário</button>
    <button data-txt="quero agendar um corte">📅 agendar</button>
    <button data-txt="MENU_RECEPCAO">🙋 recepção</button>
  </div>
  <footer>
    <input id="entrada" placeholder="Digite como se fosse o cliente… (ex: oi)" autocomplete="off" aria-label="Mensagem">
    <button id="btn-enviar" aria-label="Enviar">➤</button>
  </footer>
  </div><!-- /frame -->

<script>
(() => {
  const chat = document.getElementById('chat');
  const inputMsg = document.getElementById('entrada');
  const btnEnviar = document.getElementById('btn-enviar');
  const inputTel = document.getElementById('telefone');
  const inputNome = document.getElementById('nome');
  let desdeSeq = 0;
  let pollTimer = null;

  const escapeHtml = (s) => String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  // Formatação WhatsApp básica: *negrito*, _itálico_ (aplicada APÓS escape).
  const formatar = (s) => escapeHtml(s)
    .replace(/\*([^*\n]+)\*/g, '<b>$1</b>')
    .replace(/_([^_\n]+)_/g, '<i>$1</i>');

  const hora = () => new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'});

  function bolha(classe, html) {
    const div = document.createElement('div');
    div.className = 'msg ' + classe;
    div.innerHTML = html + `<span class="hora">${hora()}</span>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function sistema(texto) {
    const div = document.createElement('div');
    div.className = 'msg sys';
    div.textContent = texto;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  // Botões que simulam o status update que a Meta mandaria para uma mensagem do bot.
  function controlesDeStatus(div, wamid) {
    if (!wamid) return;
    div.setAttribute('data-wamid', wamid);
    const badge = document.createElement('span');
    badge.className = 'status-badge';
    badge.textContent = '· aceita';
    const wrap = document.createElement('div');
    wrap.className = 'status-controles';
    [['delivered', '✓✓ entregue'], ['read', '✓✓ lida (azul)'], ['failed', '✗ falhou']].forEach(([st, rotulo]) => {
      const b = document.createElement('button');
      b.textContent = rotulo;
      b.addEventListener('click', async () => {
        const resp = await fetch('/dev/api/status', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({wamid, status: st, telefone: inputTel.value.trim()}),
        });
        if (resp.ok) {
          badge.textContent = st === 'read' ? '· lida' : st === 'delivered' ? '· entregue' : '· falhou';
          badge.className = 'status-badge' + (st === 'read' ? ' lida' : st === 'failed' ? ' falha' : '');
          sistema(`Status "${st}" injetado no webhook — veja o tick mudar no dashboard.`);
        }
      });
      wrap.appendChild(b);
    });
    const hora = div.querySelector('.hora');
    if (hora) hora.appendChild(badge);
    div.insertBefore(wrap, hora);
  }

  function renderizarEvento(ev) {
    const p = ev.payload || {};
    // Read receipt: o bot/atendente marcou a mensagem DO CLIENTE como lida —
    // pinta de azul os ticks das bolhas de saída até esse wamid (cascata WhatsApp).
    if (ev.tipo_log === 'read_receipt' && p.message_id) {
      let alvoEncontrado = false;
      document.querySelectorAll('.msg.out').forEach(div => {
        // Percorre na ordem do DOM; marca todas até (e incluindo) o wamid alvo.
        if (!alvoEncontrado) {
          const t = div.querySelector('.tick');
          if (t) { t.textContent = '✓✓'; t.classList.add('azul'); }
          if (div.getAttribute('data-wamid') === p.message_id) alvoEncontrado = true;
        }
      });
      sistema('O bot/atendente leu suas mensagens (read receipt → ticks azuis).');
      return;
    }
    if (p.type === 'text' && p.text) {
      const div = bolha('in', formatar(p.text.body || ''));
      controlesDeStatus(div, ev.wamid);
      return;
    }
    if (p.type === 'interactive' && p.interactive) {
      const inter = p.interactive;
      let html = '';
      if (inter.header && inter.header.text) html += `<div class="header-int">${formatar(inter.header.text)}</div>`;
      if (inter.body && inter.body.text) html += formatar(inter.body.text);
      const div = bolha('in', html);
      const opcoes = document.createElement('div');
      opcoes.className = 'opcoes';
      if (inter.type === 'list' && inter.action) {
        (inter.action.sections || []).forEach(sec => {
          if (sec.title) {
            const t = document.createElement('div');
            t.className = 'secao';
            t.textContent = sec.title;
            opcoes.appendChild(t);
          }
          (sec.rows || []).forEach(row => opcoes.appendChild(botaoOpcao(row.id, row.title, row.description)));
        });
      } else if (inter.type === 'button' && inter.action) {
        (inter.action.buttons || []).forEach(b => opcoes.appendChild(botaoOpcao(b.reply.id, b.reply.title)));
      }
      if (opcoes.children.length) div.insertBefore(opcoes, div.querySelector('.hora'));
      if (inter.footer && inter.footer.text) {
        const f = document.createElement('div');
        f.className = 'footer-int';
        f.textContent = inter.footer.text;
        div.insertBefore(f, div.querySelector('.hora'));
      }
      controlesDeStatus(div, ev.wamid);
      return;
    }
    // Mídia/desconhecido: mostra o tipo cru para depuração.
    bolha('in', `<i>[${escapeHtml(p.type || 'evento')} — ver payload no console]</i>`);
    console.log('Evento dev não renderizado:', ev);
  }

  function botaoOpcao(id, titulo, descricao) {
    const btn = document.createElement('button');
    btn.innerHTML = escapeHtml(titulo || id) + (descricao ? `<small>${escapeHtml(descricao)}</small>` : '');
    btn.addEventListener('click', () => enviar(id, titulo || id));
    return btn;
  }

  async function enviar(texto, rotulo) {
    texto = (texto || '').trim();
    if (!texto) return;
    const div = bolha('out', formatar(rotulo || texto));
    // Tick da mensagem do cliente: ✓ cinza até o bot/atendente marcar como lida.
    const tick = document.createElement('span');
    tick.className = 'tick';
    tick.textContent = '✓';
    const hora = div.querySelector('.hora');
    if (hora) hora.appendChild(tick);
    btnEnviar.disabled = true;
    try {
      const resp = await fetch('/dev/api/mensagem', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({telefone: inputTel.value.trim(), nome: inputNome.value.trim(), texto}),
      });
      if (!resp.ok) {
        sistema(`Erro ${resp.status} ao enviar — veja o log do servidor.`);
      } else {
        const dados = await resp.json();
        if (dados.wamid) div.setAttribute('data-wamid', dados.wamid);
      }
    } catch (e) {
      sistema('Falha de rede: ' + e.message);
    } finally {
      btnEnviar.disabled = false;
    }
  }

  async function poll() {
    try {
      const tel = encodeURIComponent(inputTel.value.trim());
      const resp = await fetch(`/dev/api/respostas?telefone=${tel}&desde_seq=${desdeSeq}`);
      if (resp.ok) {
        const dados = await resp.json();
        (dados.eventos || []).forEach(renderizarEvento);
        desdeSeq = Math.max(desdeSeq, dados.ultimo_seq || 0);
      }
    } catch (e) { /* servidor reiniciando — tenta de novo no próximo tick */ }
    pollTimer = setTimeout(poll, 1000);
  }

  async function carregarEstado() {
    try {
      const resp = await fetch('/dev/api/estado');
      const s = await resp.json();
      const partes = [];
      if (s.db_sqlite) partes.push('DB: SQLite local');
      if (s.ia_fake) partes.push('IA: demo (sem NVIDIA_API_KEY)');
      if (s.whatsapp_fake) partes.push('WhatsApp: capturado aqui');
      const banner = document.getElementById('banner-dev');
      banner.hidden = false;
      banner.innerHTML = '⚠️ MODO DEV — ' + partes.join(' · ') +
        (s.dashboard_url ? ` · <a href="${s.dashboard_url}" target="_blank">Dashboard do atendente</a> (admin/admin123)` : '');
      document.getElementById('status-linha').textContent =
        'online · modo ' + s.modo_operacao;
    } catch (e) {
      document.getElementById('status-linha').textContent = 'offline';
    }
  }

  // Trocar telefone = nova conversa: limpa o chat e o cursor de polling.
  inputTel.addEventListener('change', () => {
    chat.innerHTML = '';
    desdeSeq = 0;
    sistema('Conversa com novo telefone: ' + inputTel.value);
  });

  btnEnviar.addEventListener('click', () => { enviar(inputMsg.value); inputMsg.value = ''; inputMsg.focus(); });
  inputMsg.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { enviar(inputMsg.value); inputMsg.value = ''; }
  });
  document.getElementById('atalhos').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-txt]');
    if (btn) enviar(btn.dataset.txt);
  });

  sistema('Simulador local — as mensagens passam pelo pipeline real do bot.');
  carregarEstado();
  poll();
})();
</script>
</body>
</html>
