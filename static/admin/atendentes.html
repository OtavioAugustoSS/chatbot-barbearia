<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Atendentes — Barbearia Bolshoi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #4a4a4a; }
  ::-webkit-scrollbar-track { background: transparent; }

  @keyframes slideIn {
    from { transform: translateX(120%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  .slide-in { animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fadeIn 0.2s ease-out; }
</style>
</head>
<body class="bg-[#212121] min-h-screen text-[#ffffff]">

  <!-- Topo -->
  <header class="bg-[#2b2b2b] border-b border-[#3a3a3a] px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="/static/admin/index.html"
         class="text-[#aaaaaa] hover:text-[#ffffff] transition flex items-center gap-1 text-sm px-2 py-1 rounded-lg hover:bg-[#2f2f2f]"
         title="Voltar ao painel">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
        <span>Voltar</span>
      </a>
      <div>
        <h1 class="text-lg font-bold text-[#ffffff]">Gerenciar Atendentes</h1>
        <p class="text-xs text-[#aaaaaa]">Barbearia Bolshoi</p>
      </div>
    </div>
    <button id="btn-novo"
            class="bg-[#2481cc] hover:bg-[#1a6eb0] active:bg-[#1560a0] text-white text-sm font-semibold px-4 py-2 rounded-lg shadow-sm transition flex items-center gap-1.5">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
      </svg>
      Novo Atendente
    </button>
  </header>

  <!-- Conteúdo -->
  <main class="max-w-4xl mx-auto px-4 py-6">

    <!-- Estado de carregamento -->
    <div id="estado-carregando" class="flex items-center justify-center py-16 text-[#aaaaaa] text-sm gap-2">
      <svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
      </svg>
      Carregando atendentes…
    </div>

    <!-- Estado vazio -->
    <div id="estado-vazio" class="hidden flex-col items-center justify-center py-16 text-center">
      <svg class="w-16 h-16 text-[#3a3a3a] mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.3">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2h5M12 12a4 4 0 100-8 4 4 0 000 8z"/>
      </svg>
      <p class="text-[#aaaaaa] font-medium">Nenhum atendente cadastrado</p>
      <p class="text-xs text-[#aaaaaa]/60 mt-1">Clique em "Novo Atendente" para começar</p>
    </div>

    <!-- Tabela -->
    <div id="container-tabela" class="hidden bg-[#1c1c1c] rounded-xl border border-[#3a3a3a] shadow-sm overflow-hidden fade-in">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-[#3a3a3a] bg-[#2b2b2b] text-xs uppercase tracking-wide text-[#aaaaaa] font-semibold sticky top-0 z-10">
            <th class="px-4 py-3 text-left">Nome</th>
            <th class="px-4 py-3 text-left">Login</th>
            <th class="px-4 py-3 text-left">Status</th>
            <th class="px-4 py-3 text-left">Último login</th>
            <th class="px-4 py-3 text-left">Ação</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela"></tbody>
      </table>
    </div>

  </main>

  <!-- Modal: novo atendente -->
  <div id="modal-overlay" class="hidden fixed inset-0 bg-black/70 z-40 flex items-center justify-center p-4">
    <div id="modal" class="bg-[#1c1c1c] border border-[#3a3a3a] rounded-2xl shadow-2xl w-full max-w-sm fade-in">
      <div class="px-6 pt-6 pb-2 flex items-center justify-between">
        <h2 class="text-base font-bold text-[#ffffff]">Novo Atendente</h2>
        <button id="btn-fechar-modal"
                class="text-[#aaaaaa] hover:text-[#ffffff] transition p-1 rounded-lg hover:bg-[#2f2f2f]">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <form id="form-criar" class="px-6 pb-6 pt-4 space-y-4">
        <div>
          <label class="block text-sm font-medium text-[#ffffff] mb-1">Nome completo</label>
          <input id="input-nome" type="text" required autocomplete="off"
                 placeholder="Ex: Maria Silva"
                 class="w-full px-3 py-2.5 bg-[#2b2b2b] border border-[#3a3a3a] rounded-lg text-sm text-[#ffffff] placeholder-[#aaaaaa] focus:ring-2 focus:ring-[#2481cc] focus:border-[#2481cc] focus:outline-none transition">
        </div>
        <div>
          <label class="block text-sm font-medium text-[#ffffff] mb-1">Login</label>
          <input id="input-login" type="text" required autocomplete="off"
                 placeholder="Ex: maria_silva"
                 pattern="^[a-z0-9_]+$"
                 title="Use apenas letras minúsculas, números e underscore"
                 class="w-full px-3 py-2.5 bg-[#2b2b2b] border border-[#3a3a3a] rounded-lg text-sm text-[#ffffff] placeholder-[#aaaaaa] focus:ring-2 focus:ring-[#2481cc] focus:border-[#2481cc] focus:outline-none transition">
          <p class="text-xs text-[#aaaaaa] mt-1">Letras minúsculas, números e underscore (_)</p>
        </div>
        <div>
          <label class="block text-sm font-medium text-[#ffffff] mb-1">Senha</label>
          <input id="input-senha" type="password" required autocomplete="new-password"
                 minlength="8" placeholder="Mínimo 8 caracteres"
                 class="w-full px-3 py-2.5 bg-[#2b2b2b] border border-[#3a3a3a] rounded-lg text-sm text-[#ffffff] placeholder-[#aaaaaa] focus:ring-2 focus:ring-[#2481cc] focus:border-[#2481cc] focus:outline-none transition">
        </div>
        <div>
          <label class="block text-sm font-medium text-[#ffffff] mb-1">Confirmar senha</label>
          <input id="input-senha-confirmar" type="password" required autocomplete="new-password"
                 minlength="8" placeholder="Repita a senha"
                 class="w-full px-3 py-2.5 bg-[#2b2b2b] border border-[#3a3a3a] rounded-lg text-sm text-[#ffffff] placeholder-[#aaaaaa] focus:ring-2 focus:ring-[#2481cc] focus:border-[#2481cc] focus:outline-none transition">
        </div>

        <p id="erro-modal" class="hidden text-sm text-red-400 bg-red-900/30 border border-red-800 rounded-lg px-3 py-2"></p>

        <button id="btn-criar" type="submit"
                class="w-full bg-[#2481cc] hover:bg-[#1a6eb0] active:bg-[#1560a0] disabled:bg-[#3a3a3a] disabled:cursor-not-allowed text-white font-semibold py-2.5 rounded-lg transition">
          Criar
        </button>
      </form>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

<script>
// ============================================================
// Auth guard
// ============================================================

const TOKEN = localStorage.getItem('token');
const ATENDENTE_ID = parseInt(localStorage.getItem('atendente_id') || '0');

if (!TOKEN) {
  window.location.href = '/static/admin/login.html';
}

// ============================================================
// API helper (mesmo padrão de app.js)
// ============================================================

async function api(url, opts = {}) {
  const res = await fetch(url, {
    ...opts,
    headers: {
      'Authorization': `Bearer ${TOKEN}`,
      'Content-Type': 'application/json',
      ...(opts.headers || {}),
    },
  });
  if (res.status === 401) {
    localStorage.clear();
    window.location.href = '/static/admin/login.html';
    return;
  }
  if (!res.ok) {
    const txt = await res.text();
    let detail = txt;
    try { detail = JSON.parse(txt).detail || txt; } catch {}
    throw new Error(detail);
  }
  // 204 No Content ou respostas sem body
  const ct = res.headers.get('content-type') || '';
  if (res.status === 204 || !ct.includes('application/json')) return null;
  return res.json();
}

// ============================================================
// XSS helper
// ============================================================

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

// ============================================================
// Toast
// ============================================================

function toast(texto, tipo = 'info') {
  const cores = { info: 'bg-[#2481cc]', ok: 'bg-emerald-700', erro: 'bg-red-700' };
  const el = document.createElement('div');
  el.className = `${cores[tipo] || cores.info} slide-in text-white px-4 py-2.5 rounded-lg shadow-lg text-sm pointer-events-auto max-w-xs`;
  el.textContent = texto;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity 0.4s, transform 0.4s';
    el.style.opacity = '0';
    el.style.transform = 'translateX(120%)';
    setTimeout(() => el.remove(), 400);
  }, 4500);
}

// ============================================================
// Formatação de data
// ============================================================

function formatarDataRelativa(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const agora = Date.now();
  const diff = (agora - d.getTime()) / 1000;
  if (diff < 60) return 'agora mesmo';
  if (diff < 3600) return `${Math.floor(diff / 60)} min atrás`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h atrás`;
  if (diff < 172800) return 'ontem';
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' });
}

// ============================================================
// Render tabela
// ============================================================

function renderTabela(atendentes) {
  const loading = document.getElementById('estado-carregando');
  const vazio = document.getElementById('estado-vazio');
  const container = document.getElementById('container-tabela');
  const tbody = document.getElementById('corpo-tabela');

  loading.classList.add('hidden');

  if (atendentes.length === 0) {
    vazio.classList.remove('hidden');
    vazio.classList.add('flex');
    container.classList.add('hidden');
    return;
  }

  vazio.classList.add('hidden');
  container.classList.remove('hidden');
  tbody.innerHTML = '';

  for (const a of atendentes) {
    const tr = document.createElement('tr');
    tr.className = 'border-b border-[#3a3a3a] last:border-0 hover:bg-[#2f2f2f] transition';

    // Status badge
    const statusHtml = a.ativo
      ? '<span class="inline-flex items-center gap-1 text-xs font-bold text-emerald-300 bg-emerald-900/50 border border-emerald-700 px-2 py-0.5 rounded-full"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span>Ativo</span>'
      : '<span class="inline-flex items-center gap-1 text-xs font-bold text-[#aaaaaa] bg-[#2b2b2b] border border-[#3a3a3a] px-2 py-0.5 rounded-full"><span class="w-1.5 h-1.5 rounded-full bg-[#aaaaaa] inline-block"></span>Inativo</span>';

    // Ação: desativar só para atendentes ativos que não sejam o usuário atual
    const ehEuMesmo = a.id === ATENDENTE_ID;
    let acaoHtml = '';
    if (!a.ativo) {
      acaoHtml = '<span class="text-xs text-[#aaaaaa]">—</span>';
    } else if (ehEuMesmo) {
      acaoHtml = '<span class="text-xs text-[#aaaaaa]" title="Não é possível desativar sua própria conta">Sua conta</span>';
    } else {
      acaoHtml = `<button
        data-id="${a.id}"
        data-nome="${escapeHtml(a.nome)}"
        class="btn-desativar text-xs text-red-400 hover:text-red-300 hover:bg-red-900/30 border border-red-800 hover:border-red-700 px-2.5 py-1 rounded-lg transition font-medium">
        Desativar
      </button>`;
    }

    tr.innerHTML = `
      <td class="px-4 py-3 font-medium text-[#ffffff]"></td>
      <td class="px-4 py-3 text-[#aaaaaa] font-mono text-xs"></td>
      <td class="px-4 py-3">${statusHtml}</td>
      <td class="px-4 py-3 text-[#aaaaaa] text-xs"></td>
      <td class="px-4 py-3">${acaoHtml}</td>
    `;

    // Inserção segura via textContent (XSS-safe)
    const nomeCell = tr.cells[0];
    const nomeSpan = document.createElement('span');
    nomeSpan.textContent = a.nome;
    nomeCell.appendChild(nomeSpan);
    if (ehEuMesmo) {
      const badge = document.createElement('span');
      badge.textContent = 'Você';
      badge.className = 'ml-2 text-[10px] font-bold text-[#2481cc] bg-[#2481cc]/20 border border-[#2481cc]/60 px-1.5 py-0.5 rounded align-middle';
      nomeCell.appendChild(badge);
    }
    tr.cells[1].textContent = a.usuario_login;
    tr.cells[3].textContent = formatarDataRelativa(a.ultimo_login);

    tbody.appendChild(tr);
  }

  // Delegação de eventos: botões de desativar
  tbody.querySelectorAll('.btn-desativar').forEach(btn => {
    btn.addEventListener('click', () => desativarAtendente(
      parseInt(btn.dataset.id),
      btn.dataset.nome,
      btn,
    ));
  });
}

// ============================================================
// Carregar atendentes
// ============================================================

async function carregarAtendentes() {
  document.getElementById('estado-carregando').classList.remove('hidden');
  const vaziEl = document.getElementById('estado-vazio');
  vaziEl.classList.add('hidden');
  vaziEl.classList.remove('flex');
  document.getElementById('container-tabela').classList.add('hidden');
  try {
    const lista = await api('/admin/atendentes');
    if (lista) renderTabela(lista);
  } catch (err) {
    document.getElementById('estado-carregando').classList.add('hidden');
    toast('Erro ao carregar atendentes: ' + err.message, 'erro');
  }
}

// ============================================================
// Desativar atendente
// ============================================================

async function desativarAtendente(id, nome, btn) {
  if (!confirm(`Desativar a conta de "${nome}"? O atendente não conseguirá mais fazer login.`)) return;
  btn.disabled = true;
  btn.textContent = 'Aguarde…';
  try {
    await api(`/admin/atendentes/${id}/desativar`, { method: 'PATCH' });
    toast(`Conta de ${nome} desativada.`, 'ok');
    await carregarAtendentes();
  } catch (err) {
    toast('Erro ao desativar: ' + err.message, 'erro');
    btn.disabled = false;
    btn.textContent = 'Desativar';
  }
}

// ============================================================
// Modal: abrir / fechar
// ============================================================

const modalOverlay = document.getElementById('modal-overlay');

function abrirModal() {
  document.getElementById('form-criar').reset();
  document.getElementById('erro-modal').classList.add('hidden');
  document.getElementById('btn-criar').disabled = false;
  document.getElementById('btn-criar').textContent = 'Criar';
  modalOverlay.classList.remove('hidden');
  setTimeout(() => document.getElementById('input-nome').focus(), 50);
}

function fecharModal() {
  modalOverlay.classList.add('hidden');
}

document.getElementById('btn-novo').addEventListener('click', abrirModal);
document.getElementById('btn-fechar-modal').addEventListener('click', fecharModal);

// Fecha ao clicar fora do modal
modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) fecharModal();
});

// Fecha com Escape
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !modalOverlay.classList.contains('hidden')) fecharModal();
});

// ============================================================
// Criar atendente
// ============================================================

document.getElementById('form-criar').addEventListener('submit', async (e) => {
  e.preventDefault();

  const nome = document.getElementById('input-nome').value.trim();
  const login = document.getElementById('input-login').value.trim().toLowerCase();
  const senha = document.getElementById('input-senha').value;
  const senhaConfirmar = document.getElementById('input-senha-confirmar').value;
  const erroEl = document.getElementById('erro-modal');
  const btnCriar = document.getElementById('btn-criar');

  erroEl.classList.add('hidden');

  // Validação cliente
  if (!nome) {
    erroEl.textContent = 'Informe o nome do atendente.';
    erroEl.classList.remove('hidden');
    document.getElementById('input-nome').focus();
    return;
  }
  if (!login) {
    erroEl.textContent = 'Informe o login.';
    erroEl.classList.remove('hidden');
    document.getElementById('input-login').focus();
    return;
  }
  if (senha.length < 8) {
    erroEl.textContent = 'A senha deve ter pelo menos 8 caracteres.';
    erroEl.classList.remove('hidden');
    document.getElementById('input-senha').focus();
    return;
  }
  if (senha !== senhaConfirmar) {
    erroEl.textContent = 'As senhas não conferem.';
    erroEl.classList.remove('hidden');
    document.getElementById('input-senha-confirmar').focus();
    return;
  }

  btnCriar.disabled = true;
  btnCriar.textContent = 'Criando…';

  try {
    await api('/admin/atendentes', {
      method: 'POST',
      body: JSON.stringify({ nome, usuario_login: login, senha }),
    });
    fecharModal();
    toast(`Atendente "${nome}" criado com sucesso.`, 'ok');
    await carregarAtendentes();
  } catch (err) {
    erroEl.textContent = err.message || 'Erro ao criar atendente.';
    erroEl.classList.remove('hidden');
    btnCriar.disabled = false;
    btnCriar.textContent = 'Criar';
  }
});

// ============================================================
// Bootstrap
// ============================================================

carregarAtendentes();
</script>
</body>
</html>
