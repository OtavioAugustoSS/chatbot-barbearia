<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Login — Barbearia Bolshoi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#111b21] flex items-center justify-center min-h-screen">
  <div class="bg-[#202c33] border border-[#2a3942] shadow-2xl rounded-2xl p-8 w-full max-w-sm">
    <div class="mb-6">
      <div class="w-16 h-16 bg-[#2481cc] rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg">
        <span class="text-2xl font-black text-white tracking-tight">BB</span>
      </div>
      <h1 class="text-2xl font-bold text-[#e9edef]">Barbearia Bolshoi</h1>
      <p class="text-sm text-[#8696a0] mt-1">Painel de Atendimento</p>
    </div>

    <form id="form-login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-[#e9edef] mb-1">Usuario</label>
        <input id="usuario" type="text" required autocomplete="username"
               class="w-full px-3 py-2.5 bg-[#2a3942] border border-[#2a3942] rounded-lg text-[#e9edef] placeholder-[#8696a0] focus:ring-2 focus:ring-[#2481cc] focus:border-[#2481cc] focus:outline-none transition">
      </div>
      <div>
        <label class="block text-sm font-medium text-[#e9edef] mb-1">Senha</label>
        <input id="senha" type="password" required autocomplete="current-password"
               class="w-full px-3 py-2.5 bg-[#2a3942] border border-[#2a3942] rounded-lg text-[#e9edef] placeholder-[#8696a0] focus:ring-2 focus:ring-[#2481cc] focus:border-[#2481cc] focus:outline-none transition">
      </div>
      <button type="submit"
              class="w-full bg-[#2481cc] hover:bg-[#1a6eb0] active:bg-[#1560a0] text-white font-semibold py-2.5 rounded-lg transition">
        Entrar
      </button>
      <p id="erro" class="text-sm text-red-400 bg-red-900/30 border border-red-800 rounded-lg px-3 py-2 hidden"></p>
    </form>
  </div>

<script>
document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const erro = document.getElementById('erro');
  erro.classList.add('hidden');
  try {
    const res = await fetch('/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        usuario_login: document.getElementById('usuario').value.trim().toLowerCase(),
        senha: document.getElementById('senha').value,
      }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      erro.textContent = data.detail || 'Erro ao entrar.';
      erro.classList.remove('hidden');
      return;
    }
    const data = await res.json();
    localStorage.setItem('token', data.token);
    localStorage.setItem('atendente_nome', data.nome);
    localStorage.setItem('atendente_id', data.atendente_id);
    if (data.ultimo_login) {
      localStorage.setItem('ultimo_login', data.ultimo_login);
    } else {
      localStorage.removeItem('ultimo_login');
    }
    window.location.href = '/static/admin/index.html';
  } catch (err) {
    erro.textContent = 'Falha de conexao.';
    erro.classList.remove('hidden');
  }
});
</script>
</body>
</html>
