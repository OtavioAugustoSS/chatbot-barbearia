<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Bolshoi Atendimento</title>
  <link rel="stylesheet" href="/static/admin/css/theme.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    // Login respeita o tema salvo (padrão: escuro)
    (function() {
      const t = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px;
      box-sizing: border-box;
      position: relative;
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    /* marca acima do card */
    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 26px;
      animation: fadeUp calc(0.5s * var(--spd)) var(--ease-out) both;
    }
    .login-brand-logo {
      width: 84px; height: 84px;
      border-radius: 20px;
      background: #0e1119;
      border: 1px solid var(--app-border-soft);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 14px;
      box-shadow: 0 0 24px color-mix(in srgb, var(--color-accent) 14%, transparent);
    }
    .login-brand-logo img { width: 70px; height: 70px; mix-blend-mode: lighten; }
    .login-brand-sub {
      font-family: var(--font-mono);
      font-size: 9.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--txt-3);
    }

    /* card do formulário */
    .login-card {
      width: 100%;
      max-width: 372px;
      background: var(--app-panel);
      border: 1px solid var(--app-border-soft);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      padding: 30px 32px 26px;
      box-sizing: border-box;
      animation: fadeUp calc(0.5s * var(--spd)) var(--ease-out) 0.08s both;
    }
    .login-card h2 {
      margin: 0 0 4px;
      font-size: 19px;
      font-weight: 500;
      text-align: center;
      color: var(--txt-1);
    }
    .login-card .login-sub {
      margin: 0 0 26px;
      font-size: 12.5px;
      color: var(--txt-2);
      text-align: center;
    }

    .login-error {
      display: none;
      align-items: flex-start;
      gap: 8px;
      font-size: 12.5px;
      color: var(--danger-text);
      background: color-mix(in srgb, var(--err) 9%, transparent);
      border: 1px solid color-mix(in srgb, var(--err) 25%, transparent);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 18px;
      animation: popIn calc(0.24s * var(--spd)) var(--ease-out) both;
    }
    .login-error.show { display: flex; }

    .login-fields { display: flex; flex-direction: column; gap: 16px; }
    .input-group { display: flex; flex-direction: column; gap: 6px; position: relative; }

    .login-btn {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      background: transparent;
      color: var(--color-accent);
      border: 1px solid var(--color-accent);
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.15s;
    }
    .login-btn:hover:not(:disabled) { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }
    .login-btn:active:not(:disabled) { background: color-mix(in srgb, var(--color-accent) 22%, transparent); transform: scale(0.99); }
    .login-btn:disabled { opacity: 0.6; }
    .login-btn .spinner {
      display: none;
      width: 14px; height: 14px;
      border: 2px solid color-mix(in srgb, var(--color-accent) 30%, transparent);
      border-top-color: var(--color-accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .login-btn.loading .spinner { display: inline-block; }
    .login-btn.loading .btn-text { display: none; }

    .toggle-senha-btn {
      position: absolute;
      right: 2px; bottom: 0;
      width: 40px; height: 40px;
      background: none; border: none;
      color: var(--txt-3);
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px;
      transition: color 0.15s;
    }
    .toggle-senha-btn:hover { color: var(--txt-1); }

    .login-divider {
      height: 1px;
      margin: 26px 0 14px;
      background: linear-gradient(90deg, transparent, var(--app-border), transparent);
    }
    .login-footer { text-align: center; font-size: 11px; color: var(--txt-3); }

    .login-version {
      position: absolute;
      left: 16px; bottom: 14px;
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--txt-3);
      opacity: 0.6;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>

  <!-- Marca -->
  <div class="login-brand">
    <div class="login-brand-logo">
      <img src="/static/admin/img/logo-bolshoi.png" alt="Barbearia Bolshoi">
    </div>
    <span class="login-brand-sub">Atendimento WhatsApp</span>
  </div>

  <!-- Card do formulário -->
  <div class="login-card">
    <h2>Entrar no painel</h2>
    <p class="login-sub">Acesse para atender as conversas</p>

    <div id="login-error" class="login-error" role="alert" aria-live="assertive"></div>

    <form id="form-login" autocomplete="on">
      <div class="login-fields">
        <div class="input-group">
          <label for="usuario_login" class="field-label">Usuário</label>
          <input
            id="usuario_login"
            name="usuario_login"
            type="text"
            class="field-input"
            autocomplete="username"
            required
            autofocus
          >
        </div>

        <div class="input-group">
          <label for="senha" class="field-label">Senha</label>
          <input
            id="senha"
            name="senha"
            type="password"
            class="field-input"
            autocomplete="current-password"
            required
            style="padding-right: 44px;"
          >
          <button type="button" id="toggle-senha" class="toggle-senha-btn" aria-label="Mostrar senha">
            <svg id="eye-show" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.964-7.178Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
            <svg id="eye-hide" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="display:none;" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          </button>
        </div>

        <button type="submit" id="btn-entrar" class="login-btn">
          <span class="spinner" aria-hidden="true"></span>
          <span class="btn-text">Entrar</span>
        </button>
      </div>
    </form>

    <div class="login-divider" aria-hidden="true"></div>
    <div class="login-footer">Não tem conta? Contate o gerente.</div>
  </div>

  <span class="login-version">v0.4.0</span>

  <script>
    // Redirect se já está logado — H11: valida o exp do token antes; um token
    // expirado redirecionava para o index, que devolvia o usuário para cá no 1º 401.
    (function () {
      const t = localStorage.getItem('token');
      if (!t) return;
      try {
        const payload = JSON.parse(atob(t.split('.')[1]));
        if (payload.exp * 1000 > Date.now()) {
          location.href = '/static/admin/index.html';
        } else {
          localStorage.removeItem('token');
        }
      } catch (_) {
        localStorage.removeItem('token');
      }
    })();

    const form     = document.getElementById('form-login');
    const inputUsr = document.getElementById('usuario_login');
    const inputPwd = document.getElementById('senha');
    const btn      = document.getElementById('btn-entrar');
    const erroEl   = document.getElementById('login-error');

    function mostrarErro(msg) {
      erroEl.textContent = msg;
      erroEl.classList.add('show');
    }

    function ocultarErro() {
      erroEl.classList.remove('show');
      erroEl.textContent = '';
    }

    // Enter no campo senha submete
    inputPwd.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      ocultarErro();

      const usuario_login = inputUsr.value.trim();
      const senha         = inputPwd.value;

      if (!usuario_login || !senha) {
        mostrarErro('Preencha usuário e senha.');
        return;
      }

      btn.disabled = true;
      btn.classList.add('loading');

      try {
        const res = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario_login, senha })
        });

        if (!res.ok) {
          let detalhe = 'Usuário ou senha inválidos.';
          try {
            const errJson = await res.json();
            if (errJson && errJson.detail) detalhe = errJson.detail;
          } catch(_) {}
          mostrarErro(detalhe);
          btn.classList.remove('loading');
          btn.disabled = false;  // H8: sem trava artificial — rate limit real é o 429 do servidor
          return;
        }

        const data = await res.json();
        localStorage.setItem('token', data.token);
        localStorage.setItem('atendente_id', data.atendente_id);
        localStorage.setItem('atendente_nome', data.nome);
        localStorage.setItem('atendente_role', data.role || 'atendente');
        location.href = '/static/admin/index.html';

      } catch (err) {
        mostrarErro('Erro de conexão. Tente novamente.');
        btn.classList.remove('loading');
        btn.disabled = false;  // H8: sem trava artificial — rate limit real é o 429 do servidor
      }
    });

    // F6: Password show/hide toggle
    document.getElementById('toggle-senha')?.addEventListener('click', () => {
      const input = document.getElementById('senha');
      const eyeShow = document.getElementById('eye-show');
      const eyeHide = document.getElementById('eye-hide');
      if (input.type === 'password') {
        input.type = 'text';
        eyeShow.style.display = 'none';
        eyeHide.style.display = 'block';
        document.getElementById('toggle-senha').setAttribute('aria-label', 'Esconder senha');
      } else {
        input.type = 'password';
        eyeShow.style.display = 'block';
        eyeHide.style.display = 'none';
        document.getElementById('toggle-senha').setAttribute('aria-label', 'Mostrar senha');
      }
    });
  </script>

</body>
</html>
