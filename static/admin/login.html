<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Login — Barbearia Bolshoi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-sm">
    <h1 class="text-2xl font-bold text-gray-800 mb-1">Barbearia Bolshoi</h1>
    <p class="text-sm text-gray-500 mb-6">Painel de Atendimento</p>

    <form id="form-login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Usuário</label>
        <input id="usuario" type="text" required autocomplete="username"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
        <input id="senha" type="password" required autocomplete="current-password"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
      </div>
      <button type="submit"
              class="w-full bg-amber-600 hover:bg-amber-700 text-white font-semibold py-2 rounded-lg transition">
        Entrar
      </button>
      <p id="erro" class="text-sm text-red-600 hidden"></p>
    </form>
  </div>

<script>
document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const erro = document.getElementById('erro');
  erro.classList.add('hidden');
  try {
    const res = await fetch('/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        usuario_login: document.getElementById('usuario').value.trim().toLowerCase(),
        senha: document.getElementById('senha').value,
      }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      erro.textContent = data.detail || 'Erro ao entrar.';
      erro.classList.remove('hidden');
      return;
    }
    const data = await res.json();
    localStorage.setItem('token', data.token);
    localStorage.setItem('atendente_nome', data.nome);
    localStorage.setItem('atendente_id', data.atendente_id);
    window.location.href = '/static/admin/index.html';
  } catch (err) {
    erro.textContent = 'Falha de conexão.';
    erro.classList.remove('hidden');
  }
});
</script>
</body>
</html>
