<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel — Barbearia Bolshoi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .scrollbar::-webkit-scrollbar { width: 6px; }
  .scrollbar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
  .scrollbar::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fadeInUp 0.22s ease-out; }

  @keyframes pulseRing {
    0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.55); }
    70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
    100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
  }
  .pulse-red { animation: pulseRing 1.6s ease-out infinite; }

  @keyframes slideIn {
    from { transform: translateX(120%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  .slide-in { animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }

  textarea#texto-msg {
    field-sizing: content;
    max-height: 120px;
    overflow-y: auto;
  }
</style>
</head>
<body class="bg-gray-50 h-screen overflow-hidden text-gray-800">
  <div class="flex h-screen">

    <!-- TASK-018: sidebar overlay backdrop (mobile) -->
    <div id="sidebar-backdrop" class="hidden fixed inset-0 bg-black/30 z-30 sm:hidden"></div>

    <!-- Sidebar conversas -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-80 bg-white border-r border-gray-200 flex flex-col transform transition-transform duration-300 -translate-x-full sm:translate-x-0 sm:static sm:z-auto sm:transform-none">
      <header class="px-4 py-3 border-b border-gray-200 flex items-center justify-between">
        <div>
          <h1 class="text-lg font-bold text-gray-900">Atendimentos</h1>
          <p id="nome-atendente" class="text-xs text-gray-500"></p>
        </div>
        <button id="btn-sair" title="Sair"
                class="text-gray-400 hover:text-red-600 transition p-1.5 rounded-lg hover:bg-red-50">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
        </button>
      </header>
      <!-- TASK-012: queue metrics bar -->
      <div id="queue-metrics" class="px-3 py-2 border-b border-gray-200 flex gap-2">
        <span class="flex-1 flex flex-col items-center bg-red-50 border border-red-100 rounded-lg py-1 px-1">
          <span id="metric-aguardando" class="text-base font-bold text-red-700 leading-none">0</span>
          <span class="text-[10px] text-red-500 mt-0.5">Aguardando</span>
        </span>
        <span class="flex-1 flex flex-col items-center bg-emerald-50 border border-emerald-100 rounded-lg py-1 px-1">
          <span id="metric-atendimento" class="text-base font-bold text-emerald-700 leading-none">0</span>
          <span class="text-[10px] text-emerald-500 mt-0.5">Em atendimento</span>
        </span>
        <span class="flex-1 flex flex-col items-center bg-blue-50 border border-blue-100 rounded-lg py-1 px-1">
          <span id="metric-bot" class="text-base font-bold text-blue-700 leading-none">0</span>
          <span class="text-[10px] text-blue-500 mt-0.5">Com bot</span>
        </span>
      </div>
      <div class="px-3 py-2 border-b border-gray-200">
        <div class="relative">
          <svg class="w-4 h-4 absolute left-3 top-2.5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M11 18a7 7 0 100-14 7 7 0 000 14z"/>
          </svg>
          <input id="filtro" type="text" placeholder="Buscar por nome ou telefone…"
                 class="w-full pl-9 pr-3 py-2 text-sm bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-amber-400 focus:outline-none transition">
        </div>
      </div>
      <ul id="lista-conversas" class="flex-1 overflow-y-auto scrollbar"></ul>
      <footer class="px-3 py-2 border-t border-gray-200 text-[11px] text-gray-500">
        <div class="flex items-center justify-between mb-1.5">
          <a href="/static/admin/atendentes.html"
             class="text-gray-400 hover:text-amber-600 transition flex items-center gap-1"
             title="Gerenciar atendentes">
            <span>⚙</span>
            <span>Atendentes</span>
          </a>
        </div>
        <div class="flex items-center justify-between">
          <span id="status-conexao" class="flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-green-500"></span> conectado
          </span>
          <button id="btn-mute" title="Silenciar notificações" class="hover:text-gray-700 transition p-1 rounded">
            <svg xmlns="http://www.w3.org/2000/svg" id="icone-som" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 8.25v7.5L12 18 9 15.75H6V8.25h3L12 6l3 2.25zM18 9.75a3.75 3.75 0 010 4.5M20.25 7.5a6.75 6.75 0 010 9"/>
            </svg>
          </button>
        </div>
        <p id="ultimo-acesso" class="text-[10px] text-gray-400 mt-0.5 hidden"></p>
      </footer>
    </aside>

    <!-- Thread -->
    <main class="flex-1 flex flex-col bg-gray-100">
      <header id="thread-header" class="bg-white border-b border-gray-200 px-4 py-3 hidden">
        <div class="flex items-center justify-between gap-3">
          <div class="flex items-center gap-3 min-w-0">
            <!-- TASK-018: hamburger visible only on mobile -->
            <button id="btn-hamburger" type="button"
                    class="sm:hidden flex-shrink-0 text-gray-500 hover:text-gray-800 p-1 rounded-lg hover:bg-gray-100 transition">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
              </svg>
            </button>
            <div id="thread-avatar" class="flex-shrink-0"></div>
            <div class="min-w-0">
              <h2 id="thread-nome" class="font-bold text-gray-900 truncate"></h2>
              <p id="thread-telefone" class="text-xs text-gray-500"></p>
            </div>
          </div>
          <div class="flex gap-2 flex-shrink-0">
            <button id="btn-assumir" class="hidden bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white text-sm font-medium px-3.5 py-1.5 rounded-lg shadow-sm transition">Assumir</button>
            <button id="btn-devolver" class="hidden bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-700 text-sm font-medium px-3.5 py-1.5 rounded-lg border border-gray-200 transition">Devolver à IA</button>
          </div>
        </div>
        <p id="thread-status" class="text-xs mt-1.5"></p>
        <div id="tag-selector" class="flex items-center gap-1.5 mt-2 flex-wrap">
          <span class="text-[10px] text-gray-400 font-medium uppercase tracking-wide mr-0.5">Tag:</span>
          <button type="button" data-tag="resolvido"
                  class="text-[10px] font-bold text-green-700 bg-green-50 border border-green-200 hover:bg-green-100 px-2 py-0.5 rounded transition ring-green-400">
            &#10003; Resolvido
          </button>
          <button type="button" data-tag="follow_up"
                  class="text-[10px] font-bold text-yellow-700 bg-yellow-50 border border-yellow-200 hover:bg-yellow-100 px-2 py-0.5 rounded transition ring-yellow-400">
            &#8617; Follow-up
          </button>
          <button type="button" data-tag=""
                  class="text-[10px] font-bold text-gray-500 bg-gray-50 border border-gray-200 hover:bg-gray-100 px-2 py-0.5 rounded transition ring-gray-300">
            Remover tag
          </button>
        </div>
      </header>

      <div id="thread-mensagens" class="flex-1 overflow-y-auto p-4 space-y-2 scrollbar">
        <!-- Empty state -->
        <div id="empty-state" class="flex flex-col items-center justify-center h-full text-center select-none">
          <svg class="w-32 h-32 mb-4 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a5.969 5.969 0 01-.474-.065 4.48 4.48 0 00.978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z"/>
          </svg>
          <p class="text-base text-gray-500 font-medium">Selecione uma conversa</p>
          <p class="text-xs text-gray-400 mt-1.5">Escolha alguém da lista pra ver o histórico e atender</p>
        </div>
      </div>

      <!-- TASK-015: Notas internas — collapsible panel, hidden until a conversation is open -->
      <div id="painel-notas" class="hidden bg-white border-t border-gray-200">
        <button id="btn-toggle-notas" type="button"
                class="w-full flex items-center justify-between px-4 py-2 text-xs font-semibold text-gray-600 hover:bg-gray-50 transition select-none">
          <span>📝 Notas Internas</span>
          <svg id="icone-notas-chevron" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-400 transition-transform duration-200 rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
        <div id="corpo-notas" class="hidden px-4 pb-3 space-y-2">
          <ul id="lista-notas" class="space-y-1.5 max-h-40 overflow-y-auto scrollbar text-sm"></ul>
          <div class="flex gap-2 pt-1">
            <textarea id="textarea-nota" rows="2" placeholder="Escreva uma nota interna…"
                      class="flex-1 px-2.5 py-1.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-amber-400 focus:border-amber-400 focus:outline-none resize-none transition"></textarea>
            <button id="btn-adicionar-nota" type="button"
                    class="bg-amber-500 hover:bg-amber-600 active:bg-amber-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white text-xs font-semibold px-3 rounded-lg transition self-stretch">
              Adicionar nota
            </button>
          </div>
        </div>
      </div>

      <footer id="thread-footer" class="bg-white border-t border-gray-200 px-3 py-3 hidden">
        <!-- TASK-013: canned responses popover -->
        <div class="relative mb-2">
          <div id="popover-rapidas" class="hidden absolute bottom-full left-0 mb-1 w-72 bg-white border border-gray-200 rounded-xl shadow-lg z-30 overflow-hidden">
            <p class="px-3 py-1.5 text-[10px] uppercase font-bold text-gray-400 border-b border-gray-100">Respostas rápidas</p>
            <div id="lista-rapidas" class="max-h-56 overflow-y-auto scrollbar"></div>
          </div>
          <button id="btn-rapidas" type="button"
                  class="text-xs text-gray-500 hover:text-amber-600 border border-gray-200 hover:border-amber-300 bg-gray-50 hover:bg-amber-50 px-2.5 py-1.5 rounded-lg transition flex items-center gap-1.5">
            <span>💬</span> Rápidas
          </button>
        </div>
        <form id="form-enviar" class="flex items-end gap-2">
          <textarea id="texto-msg" rows="1" required placeholder="Digite uma mensagem… (Enter envia, Shift+Enter quebra linha)"
                    class="flex-1 px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-amber-400 focus:border-amber-400 focus:outline-none resize-none text-sm transition"></textarea>
          <button id="btn-enviar" type="submit"
                  class="bg-amber-500 hover:bg-amber-600 active:bg-amber-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-semibold px-5 py-2 rounded-lg shadow-sm transition flex-shrink-0 self-stretch">
            Enviar
          </button>
        </form>
      </footer>
    </main>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script src="/static/admin/app.js"></script>
</body>
</html>
