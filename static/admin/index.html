<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel — Barbearia Bolshoi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .scrollbar::-webkit-scrollbar { width: 6px; }
  .scrollbar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
</style>
</head>
<body class="bg-gray-100 h-screen overflow-hidden">
  <div class="flex h-screen">

    <!-- Sidebar conversas -->
    <aside class="w-80 bg-white border-r flex flex-col">
      <header class="p-4 border-b flex items-center justify-between">
        <div>
          <h1 class="text-lg font-bold text-gray-800">Atendimentos</h1>
          <p id="nome-atendente" class="text-xs text-gray-500"></p>
        </div>
        <button id="btn-sair" class="text-xs text-gray-500 hover:text-red-600">Sair</button>
      </header>
      <div class="p-2 border-b">
        <input id="filtro" type="text" placeholder="Filtrar por nome ou telefone…"
               class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
      </div>
      <ul id="lista-conversas" class="flex-1 overflow-y-auto scrollbar"></ul>
    </aside>

    <!-- Thread -->
    <main class="flex-1 flex flex-col bg-gray-50">
      <header id="thread-header" class="bg-white border-b p-4 hidden">
        <div class="flex items-center justify-between">
          <div>
            <h2 id="thread-nome" class="font-bold text-gray-800"></h2>
            <p id="thread-telefone" class="text-xs text-gray-500"></p>
          </div>
          <div class="flex gap-2">
            <button id="btn-assumir" class="hidden bg-amber-600 hover:bg-amber-700 text-white text-sm font-medium px-3 py-1.5 rounded-lg">Assumir</button>
            <button id="btn-devolver" class="hidden bg-gray-200 hover:bg-gray-300 text-gray-800 text-sm font-medium px-3 py-1.5 rounded-lg">Devolver à IA</button>
          </div>
        </div>
        <p id="thread-status" class="text-xs mt-1"></p>
      </header>

      <div id="thread-mensagens" class="flex-1 overflow-y-auto p-4 space-y-2 scrollbar">
        <p class="text-center text-gray-400 mt-20">Selecione uma conversa à esquerda.</p>
      </div>

      <footer id="thread-footer" class="bg-white border-t p-3 hidden">
        <form id="form-enviar" class="flex gap-2">
          <input id="texto-msg" type="text" required placeholder="Digite uma mensagem…"
                 class="flex-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
          <button type="submit" class="bg-amber-600 hover:bg-amber-700 text-white font-semibold px-5 rounded-lg">Enviar</button>
        </form>
      </footer>
    </main>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-4 right-4 bg-amber-600 text-white px-4 py-2 rounded-lg shadow-lg"></div>

  <script src="/static/admin/app.js"></script>
</body>
</html>
